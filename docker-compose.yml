version: '3.8'

services:
  web:
    build: .
    command: >
      bash -c "python ./WoodWoorldStroy/manage.py makemigrations
      && python ./WoodWoorldStroy/manage.py migrate
      && cd WoodWoorldStroy
      && exec gunicorn WoodWoorldStroy.wsgi:application --bind 0.0.0.0:8000"

    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=mydb
      - DB_USER=user
      - DB_PASSWORD=password

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./WoodWoorldStroy/static:/app/static  # Статика Django
      - ./WoodWoorldStroy/media:/app/media    # Медиафайлы Django
    depends_on:
      - web

volumes:
  postgres_data: